name: Generate theme catalog

on:
  push:
    branches:
      - main
    paths:
      - "theme/**"
      - "scripts/generate_catalog.ts"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - ".github/workflows/generate-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run lint

      - name: Generate catalog and README
        run: bun run generate

      - name: Commit generated files
        run: |
          if git diff --quiet -- README.md index.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.json
          git commit -m "chore: regenerate theme catalog [skip ci]"
          git push
